# ╔══════════════════════════════════════════════════════════════════╗
# ║  Deploy  —  build → staging → canary → production → release     ║
# ║  Runs only on push to master                                     ║
# ╚══════════════════════════════════════════════════════════════════╝
name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # не отменяем деплой на прод

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ghcr.io/${{ github.repository_owner }}/content-platform

jobs:
  # ╔════════════════════════════════════════════════════════════════╗
  # ║  BUILD                                                         ║
  # ╚════════════════════════════════════════════════════════════════╝
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=canary

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:stable
          cache-to:   type=inline

  # ╔════════════════════════════════════════════════════════════════╗
  # ║  STAGING                                                       ║
  # ╚════════════════════════════════════════════════════════════════╝
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.content-platform.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Create namespace
        run: |
          kubectl create namespace content-platform-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="${{ env.REGISTRY }}" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            -n content-platform-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD_STAGING }}" \
            --from-literal=QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
            -n content-platform-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          NAMESPACE: content-platform-staging
          REPLICAS: "1"
          DB_HOST: ${{ secrets.DB_HOST_STAGING }}
          QDRANT_URL: ${{ secrets.QDRANT_URL_STAGING }}
        run: |
          envsubst < .k8s/deployment-stable.yaml | kubectl apply -f -
          kubectl apply -f .k8s/service.yaml -n "$NAMESPACE"
          kubectl apply -f .k8s/ingress-staging.yaml -n "$NAMESPACE"
          kubectl rollout status deployment/content-platform-stable \
            -n "$NAMESPACE" --timeout=180s

      - name: Smoke test
        run: bash .scripts/smoke-test.sh "https://staging.content-platform.example.com"

  # ╔════════════════════════════════════════════════════════════════╗
  # ║  CANARY  (10% трафика)                                         ║
  # ╚════════════════════════════════════════════════════════════════╝
  deploy-canary:
    name: Deploy → Canary (10%)
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production/canary
      url: https://content-platform.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="${{ env.REGISTRY }}" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            -n content-platform-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy canary
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          NAMESPACE: content-platform-prod
          REPLICAS: "1"
          DB_HOST: ${{ secrets.DB_HOST_PROD }}
          QDRANT_URL: ${{ secrets.QDRANT_URL_PROD }}
        run: |
          envsubst < .k8s/deployment-canary.yaml | kubectl apply -f -
          kubectl rollout status deployment/content-platform-canary \
            -n "$NAMESPACE" --timeout=120s

      - name: Set canary weight (10%)
        run: |
          kubectl annotate ingress content-platform-ingress \
            nginx.ingress.kubernetes.io/canary="true" \
            nginx.ingress.kubernetes.io/canary-weight="10" \
            -n content-platform-prod --overwrite

  # ╔════════════════════════════════════════════════════════════════╗
  # ║  VERIFY CANARY                                                 ║
  # ╚════════════════════════════════════════════════════════════════╝
  verify-canary:
    name: Verify canary health
    needs: deploy-canary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: apk add --no-cache curl jq bc 2>/dev/null || apt-get install -y curl jq bc -qq

      - name: Run canary verification
        env:
          PROMETHEUS_URL:           ${{ secrets.PROMETHEUS_URL }}
          CANARY_ERROR_THRESHOLD:   "1"
          CANARY_LATENCY_THRESHOLD: "2000"
          CANARY_VERIFY_DURATION:   "120"
        run: bash .scripts/verify-canary.sh

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > /tmp/kubeconfig
          kubectl delete deployment content-platform-canary \
            -n content-platform-prod --ignore-not-found
          kubectl annotate ingress content-platform-ingress \
            nginx.ingress.kubernetes.io/canary- \
            nginx.ingress.kubernetes.io/canary-weight- \
            -n content-platform-prod --overwrite || true
          echo "::error::Canary failed — rolled back. 100% traffic on stable."

  # ╔════════════════════════════════════════════════════════════════╗
  # ║  PRODUCTION                                                    ║
  # ╚════════════════════════════════════════════════════════════════╝
  deploy-production:
    name: Deploy → Production
    needs: [build, verify-canary]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://content-platform.example.com
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Roll out stable deployment
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          NAMESPACE: content-platform-prod
          REPLICAS: "3"
          DB_HOST: ${{ secrets.DB_HOST_PROD }}
          QDRANT_URL: ${{ secrets.QDRANT_URL_PROD }}
        run: |
          envsubst < .k8s/deployment-stable.yaml | kubectl apply -f -
          kubectl rollout status deployment/content-platform-stable \
            -n "$NAMESPACE" --timeout=300s

      - name: Remove canary
        run: |
          kubectl delete deployment content-platform-canary \
            -n content-platform-prod --ignore-not-found
          kubectl annotate ingress content-platform-ingress \
            nginx.ingress.kubernetes.io/canary- \
            nginx.ingress.kubernetes.io/canary-weight- \
            -n content-platform-prod --overwrite || true

      - name: Tag image as stable
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash .scripts/retag.sh \
            "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}" \
            "${{ env.IMAGE_NAME }}:stable"

      - name: Smoke test production
        run: bash .scripts/smoke-test.sh "https://content-platform.example.com"

  # ╔════════════════════════════════════════════════════════════════╗
  # ║  RELEASE  (semantic-release)                                   ║
  # ╚════════════════════════════════════════════════════════════════╝
  release:
    name: Release
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: write       # создать тег + GitHub Release
      issues: write         # закрывать issues через commit message
      pull-requests: write  # комментировать PR с changelog

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # нужна полная история для semantic-release
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
