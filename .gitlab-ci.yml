# ╔══════════════════════════════════════════════════════════════════╗
# ║         Multi-Brand AI Content Platform  —  GitLab CI/CD        ║
# ║                                                                  ║
# ║  Stages:  validate → test → build → staging →                   ║
# ║           canary → canary:verify → production                   ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Global defaults ───────────────────────────────────────────────────────────
default:
  image: node:20-alpine
  interruptible: true
  tags:
    - docker

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  REGISTRY:         "$CI_REGISTRY"                      # registry.gitlab.lenincrew.tech
  IMAGE_NAME:       "$CI_REGISTRY_IMAGE"
  IMAGE_TAG:        "$CI_COMMIT_SHA"
  IMAGE_STABLE_TAG: "$CI_REGISTRY_IMAGE:stable"
  IMAGE_CANARY_TAG: "$CI_REGISTRY_IMAGE:canary"

  KUBE_NAMESPACE_STAGING:    "content-platform-staging"
  KUBE_NAMESPACE_PRODUCTION: "content-platform-prod"

  CANARY_WEIGHT:    "10"   # % трафика на канарею
  CANARY_REPLICAS:  "1"
  STABLE_REPLICAS:  "3"

  # Thresholds для автоматической проверки канарейки
  CANARY_ERROR_THRESHOLD:   "1"    # % ошибок (выше → откат)
  CANARY_LATENCY_THRESHOLD: "2000" # ms p99 (выше → откат)
  CANARY_VERIFY_DURATION:   "120"  # секунд наблюдения

  NODE_ENV: "test"
  FF_USE_FASTZIP: "true"

# ── Cache ─────────────────────────────────────────────────────────────────────
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

# ── Стадии ───────────────────────────────────────────────────────────────────
stages:
  - validate
  - test
  - build
  - deploy:staging
  - deploy:canary
  - verify:canary
  - deploy:production
  - release

# ╔══════════════════════════════════════════════════════════════════╗
# ║  VALIDATE                                                        ║
# ╚══════════════════════════════════════════════════════════════════╝

install:
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: push
  script:
    - npm ci --prefer-offline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

lint:
  stage: validate
  <<: *node_cache
  script:
    - npm run lint
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

typecheck:
  stage: validate
  <<: *node_cache
  script:
    - npx tsc --noEmit
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  TEST                                                            ║
# ╚══════════════════════════════════════════════════════════════════╝

unit:test:
  stage: test
  <<: *node_cache
  script:
    - npm run test -- --ci --forceExit --coverage
  needs: [install]
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  BUILD                                                           ║
# ╚══════════════════════════════════════════════════════════════════╝

build:image:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Используем предыдущий stable как кэш-слой
    - docker pull "$IMAGE_STABLE_TAG" || true
    - |
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMAGE_STABLE_TAG" \
        --label "git.commit=$CI_COMMIT_SHA" \
        --label "git.branch=$CI_COMMIT_REF_NAME" \
        --label "ci.pipeline=$CI_PIPELINE_URL" \
        --label "built.at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_CANARY_TAG" \
        .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_CANARY_TAG"
  needs: [lint, typecheck, unit:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGING                                                         ║
# ╚══════════════════════════════════════════════════════════════════╝

deploy:staging:
  stage: deploy:staging
  image: bitnami/kubectl:1.29
  environment:
    name: staging
    url: https://staging.content-platform.lenincrew.tech
    on_stop: stop:staging
  before_script:
    - echo "$KUBE_CONFIG_STAGING" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl create namespace "$KUBE_NAMESPACE_STAGING" --dry-run=client -o yaml | kubectl apply -f -
    - |
      kubectl create secret docker-registry regcred \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$CI_REGISTRY_USER" \
        --docker-password="$CI_REGISTRY_PASSWORD" \
        -n "$KUBE_NAMESPACE_STAGING" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      kubectl create secret generic app-secrets \
        --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
        --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
        --from-literal=GOOGLE_AI_API_KEY="$GOOGLE_AI_API_KEY" \
        --from-literal=DB_PASSWORD="$DB_PASSWORD_STAGING" \
        --from-literal=QDRANT_API_KEY="$QDRANT_API_KEY" \
        -n "$KUBE_NAMESPACE_STAGING" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      IMAGE_TAG="$IMAGE_TAG" \
      NAMESPACE="$KUBE_NAMESPACE_STAGING" \
      REPLICAS=1 \
      DB_HOST="$DB_HOST_STAGING" \
      QDRANT_URL="$QDRANT_URL_STAGING" \
      envsubst < k8s/deployment-stable.yaml | kubectl apply -f -
    - kubectl apply -f k8s/service.yaml -n "$KUBE_NAMESPACE_STAGING"
    - kubectl apply -f k8s/ingress-staging.yaml -n "$KUBE_NAMESPACE_STAGING"
    - |
      kubectl rollout status deployment/content-platform-stable \
        -n "$KUBE_NAMESPACE_STAGING" \
        --timeout=180s
    - bash scripts/smoke-test.sh "https://staging.content-platform.lenincrew.tech"
  needs: [build:image]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

stop:staging:
  stage: deploy:staging
  image: bitnami/kubectl:1.29
  environment:
    name: staging
    action: stop
  before_script:
    - echo "$KUBE_CONFIG_STAGING" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl delete namespace "$KUBE_NAMESPACE_STAGING" --ignore-not-found
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  CANARY  (10% трафика)                                           ║
# ╚══════════════════════════════════════════════════════════════════╝

deploy:canary:
  stage: deploy:canary
  image: bitnami/kubectl:1.29
  environment:
    name: production/canary
    url: https://content-platform.lenincrew.tech
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      kubectl create secret docker-registry regcred \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$CI_REGISTRY_USER" \
        --docker-password="$CI_REGISTRY_PASSWORD" \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --dry-run=client -o yaml | kubectl apply -f -
    # Деплоим канарейку (1 реплика, отдельный Deployment)
    - |
      IMAGE_TAG="$IMAGE_TAG" \
      NAMESPACE="$KUBE_NAMESPACE_PRODUCTION" \
      REPLICAS="$CANARY_REPLICAS" \
      DB_HOST="$DB_HOST_PROD" \
      QDRANT_URL="$QDRANT_URL_PROD" \
      envsubst < k8s/deployment-canary.yaml | kubectl apply -f -
    # Обновляем веса в Ingress: 10% → canary, 90% → stable
    - |
      kubectl annotate ingress content-platform-ingress \
        nginx.ingress.kubernetes.io/canary="true" \
        nginx.ingress.kubernetes.io/canary-weight="$CANARY_WEIGHT" \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --overwrite
    - |
      kubectl rollout status deployment/content-platform-canary \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --timeout=120s
    - echo "Canary deployed. Weight = ${CANARY_WEIGHT}%. Monitoring for ${CANARY_VERIFY_DURATION}s..."
  needs: [deploy:staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  VERIFY CANARY                                                   ║
# ╚══════════════════════════════════════════════════════════════════╝

verify:canary:auto:
  stage: verify:canary
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl jq bc
  script:
    - bash scripts/verify-canary.sh
  needs: [deploy:canary]
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

rollback:canary:
  stage: verify:canary
  image: bitnami/kubectl:1.29
  environment:
    name: production/canary
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Rolling back canary deployment..."
    - kubectl delete deployment content-platform-canary -n "$KUBE_NAMESPACE_PRODUCTION" --ignore-not-found
    - |
      kubectl annotate ingress content-platform-ingress \
        nginx.ingress.kubernetes.io/canary- \
        nginx.ingress.kubernetes.io/canary-weight- \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --overwrite || true
    - echo "Canary rolled back. 100% traffic on stable."
  when: on_failure
  needs: [verify:canary:auto]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  PRODUCTION  (полный роллаут)                                    ║
# ╚══════════════════════════════════════════════════════════════════╝

deploy:production:
  stage: deploy:production
  image: bitnami/kubectl:1.29
  environment:
    name: production
    url: https://content-platform.lenincrew.tech
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # Роллаут стабильного деплоя на новый образ
    - |
      IMAGE_TAG="$IMAGE_TAG" \
      NAMESPACE="$KUBE_NAMESPACE_PRODUCTION" \
      REPLICAS="$STABLE_REPLICAS" \
      DB_HOST="$DB_HOST_PROD" \
      QDRANT_URL="$QDRANT_URL_PROD" \
      envsubst < k8s/deployment-stable.yaml | kubectl apply -f -
    - |
      kubectl rollout status deployment/content-platform-stable \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --timeout=300s
    # Убираем канарейку и снимаем Ingress-аннотации
    - kubectl delete deployment content-platform-canary -n "$KUBE_NAMESPACE_PRODUCTION" --ignore-not-found
    - |
      kubectl annotate ingress content-platform-ingress \
        nginx.ingress.kubernetes.io/canary- \
        nginx.ingress.kubernetes.io/canary-weight- \
        -n "$KUBE_NAMESPACE_PRODUCTION" \
        --overwrite || true
    # Тегируем образ как stable
    - |
      echo "$CI_REGISTRY_PASSWORD" | \
        docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" 2>/dev/null || true
    - bash scripts/retag.sh "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_STABLE_TAG"
    - bash scripts/smoke-test.sh "https://content-platform.lenincrew.tech"
  needs: [verify:canary:auto]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  RELEASE  (semantic-release)                                     ║
# ╚══════════════════════════════════════════════════════════════════╝

release:
  stage: release
  before_script:
    - apk add --no-cache git
    - npm ci --prefer-offline
  script:
    - npx semantic-release
  needs: [deploy:production]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
