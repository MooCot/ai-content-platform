apiVersion: v1
kind: Service
metadata:
  name: content-platform
  namespace: ${NAMESPACE}
  labels:
    app: content-platform
spec:
  type: ClusterIP
  selector:
    # Выбирает оба трека (stable + canary) — Ingress сам делит трафик
    app: content-platform
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
